<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0F1117"/>
  <!-- Neural network: 3 layers -->
  <!-- Input nodes -->
  <circle cx="7" cy="10" r="2.5" fill="#2563EB"/>
  <circle cx="7" cy="22" r="2.5" fill="#2563EB"/>
  <!-- Hidden nodes -->
  <circle cx="16" cy="7" r="2.5" fill="#60A5FA"/>
  <circle cx="16" cy="16" r="2.5" fill="#60A5FA"/>
  <circle cx="16" cy="25" r="2.5" fill="#60A5FA"/>
  <!-- Output node -->
  <circle cx="25" cy="16" r="2.5" fill="#2563EB"/>
  <!-- Connections: input to hidden -->
  <line x1="9.5" y1="10" x2="13.5" y2="7" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
  <line x1="9.5" y1="10" x2="13.5" y2="16" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
  <line x1="9.5" y1="10" x2="13.5" y2="25" stroke="#2563EB" stroke-width="1" opacity="0.4"/>
  <line x1="9.5" y1="22" x2="13.5" y2="7" stroke="#2563EB" stroke-width="1" opacity="0.4"/>
  <line x1="9.5" y1="22" x2="13.5" y2="16" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
  <line x1="9.5" y1="22" x2="13.5" y2="25" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
  <!-- Connections: hidden to output -->
  <line x1="18.5" y1="7" x2="22.5" y2="16" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
  <line x1="18.5" y1="16" x2="22.5" y2="16" stroke="#60A5FA" stroke-width="1.2" opacity="0.8"/>
  <line x1="18.5" y1="25" x2="22.5" y2="16" stroke="#60A5FA" stroke-width="1" opacity="0.5"/>
</svg>
